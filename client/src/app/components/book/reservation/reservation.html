<div class="reservation-overlay">
    <div class="reservation-card" style="font-family: 'Inter', sans-serif;">
        <h3>Réserver : {{ book().titre }}</h3>

        <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="nomEmprunteur">Nom de l'emprunteur</label>
                <input id="nomEmprunteur" type="text" formControlName="nomEmprunteur" 
                       placeholder="Votre nom complet" style="font-family: inherit;">
                @if (reservationForm.get('nomEmprunteur')?.invalid && reservationForm.get('nomEmprunteur')?.touched) {
                    <span class="error-message">Le nom est requis.</span>
                }
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label>Début</label>
                    <input type="date" formControlName="dateEmprunt" style="font-family: inherit;">
                </div>
                <div class="form-group flex-1">
                    <label>Fin</label>
                    <input type="date" formControlName="dateRetour" style="font-family: inherit;">
                </div>
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn-confirm" [disabled]="reservationForm.invalid" style="font-family: inherit;">
                    Confirmer
                </button>
                <button type="button" class="btn-cancel" (click)="onCancel()" style="font-family: inherit;">
                    Annuler
                </button>
            </div>
        </form>
    </div>
</div>
